
name: Build QC Toolbox IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          echo "Available Xcode:"
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version

      - name: Build QC Toolbox
        run: |
          xcodebuild \
            -project QCToolbox.xcodeproj \
            -scheme QCToolbox \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app
        run: |
          APP="build/Build/Products/Release-iphoneos/QCToolbox.app"
          test -d "$APP"
          echo "Build successful!"
          ls -la "$APP"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QCToolbox.app Payload/
          zip -qr QC-Toolbox-unsigned.ipa Payload
          test -f QC-Toolbox-unsigned.ipa
          unzip -l QC-Toolbox-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QC-Toolbox-unsigned-IPA
          path: QC-Toolbox-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
